<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="590" viewBox="0 0 1620 590" role="img" aria-label="Clients call flasky-api, an API Gateway HTTP API with an auto-deployed $default stage, over HTTPS. Each of its four routes, GET /gtg, GET and POST /candidate/{name}, and GET /candidates, invokes its own Python 3.13 Lambda function through an AWS_PROXY integration, and the functions read and write the Candidates table in DynamoDB. When the routes are switched to AWS_IAM authorization, clients sign requests with the keys of the flasky-api-user IAM user."><defs><marker id="a_e_https" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_sign" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_proxy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8d6e8"/></marker><marker id="a_e_role" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_ddb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker></defs><rect width="1620" height="590" fill="#0d1117"/><path d="M810.0,150 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_https)"/><text x="824.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">HTTPS</text><path d="M1160,95.0 H1025" fill="none" stroke="#7ee787" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a_e_sign)"/><text x="1090.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">SigV4</text><path d="M810.0,350 V435" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_proxy)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">AWS_PROXY</text><path d="M460,295.0 H530.0 V470.0 H595" fill="none" stroke="#c8d6e8" stroke-width="2" marker-end="url(#a_e_code)"/><text x="516.0" y="401.0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c8d6e8" stroke="#0d1117" stroke-width="6" paint-order="stroke">code</text><path d="M460,520.0 H595" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_role)"/><text x="550.0" y="510.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">assumes</text><path d="M1020,495.0 H1155" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_ddb)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">read / write</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Postman / curl</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">from the internet</text><rect x="1160" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2" stroke-dasharray="10 7"/><g transform="translate(1180,80.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></g><text x="1224.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">flasky-api-user</text><text x="1224.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">IAM keys, only with AWS_IAM</text><rect x="600" y="240" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#f2c163" stroke-width="2"/><g transform="translate(620,280.0) scale(1.25)" fill="none" stroke="#f2c163" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H12"/></g><text x="664.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">flasky-api</text><text x="664.0" y="317.0